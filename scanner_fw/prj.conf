# Bluetooth: passive scanning; connectable only in flash mode
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="sector-scanner"
# Scan from the identity address, so flash-mode advertising (same address under
# legacy adverts) can start while scanning; passive scans never transmit anyway
CONFIG_BT_SCAN_WITH_IDENTITY=y

# Firmware updates over BLE (MCUmgr SMP) into MCUboot's second slot.
# No remote storage erase.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_GRP_ZBASIC=n

# Sector ID and antenna choice kept in flash (storage partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_REBOOT=y

# RF switch (board regulators on P2.03/P2.05) and heartbeat LED
CONFIG_REGULATOR=y
CONFIG_GPIO=y

# USB console (onboard USB-serial bridge) with a shell for bench commands
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="scan> "

# Gateway frames on uart21 (D6/D7): interrupt-driven TX, CRC-16
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CRC=y

# Chip ID (FICR) addresses commands on the shared D7 line; reset cause for boot events
CONFIG_HWINFO=y

# Protobuf buckets and commands (proto/bletracker.proto)
CONFIG_NANOPB=y

# Bucket building (nanopb encode) in main, command decode in the system workqueue
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
