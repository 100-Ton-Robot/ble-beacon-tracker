# MCUboot in front of the app so sealed scanners can be updated over BLE (SMP).
# Swap-using-move with revert: a new image runs as a test and is rolled back
# unless it confirms itself (main.c does after 60 s of healthy running).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Ed25519 key kept outside the repo; MCUboot only boots images signed with it.
# Back it up: without it, sealed scanners can't be updated.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="C:/fw/keys/bletracker-mcuboot-ed25519.pem"
