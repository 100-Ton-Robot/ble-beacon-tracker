<g id="layer_notes" inkscape:groupmode="layer" inkscape:label="Notes (locked)" sodipodi:insensitive="true">
<text x="-83" y="80.0" font-size="2.4" font-family="sans-serif">PIPE PLATE: move S0 (S1 / S2 are clones turned 120 deg) and the bus (kept radial, M3 toward the rim).</text><text x="-83" y="83.2" font-size="2.4" font-family="sans-serif">The bus M3 offset is shared with the alt plate: set it there.</text><text x="-83" y="86.4" font-size="2.4" font-family="sans-serif">Move / rotate whole part groups (don't scale or flip them). Double-click a part to slide its tie or M3 hole along it.</text><text x="-83" y="89.6" font-size="2.4" font-family="sans-serif">Then: python read_plate_svg.py  (positions -> parameters.csv + clearance check),  python make_templates.py  (PDF).</text><text x="-83" y="92.8" font-size="2.4" font-family="sans-serif">Dashed parts hang under the plate. Red dotted rings: antenna-hole keep-out. Coax runs on to the jacks are checked, not drawn.</text>
</g>
</svg>
