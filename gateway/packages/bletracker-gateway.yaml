# BLE tracker mast gateway, shared by every mast: ESP32-S3 + W5500 Ethernet, 3 sector
# scanners on UART -> MQTT. Needs scanner firmware 0.5.0 or later (protocol 3, protobuf
# buckets every 200 ms: ../../scanner_fw/PROTOCOL.md). MQTT layout v3 under
# bletracker/<mast>/ (topics and payloads: ../README.md "MQTT output"). Home Assistant gets
# the gateway's own entities over the ESPHome API; MQTT carries only the beacon data, events
# and commands.
#
# Not a device config on its own: each mast has a small file (see ../example-mast.yaml)
# that sets mast, name, friendly_name and api_key, then includes this with `packages:`.

substitutions:
  # NTP server; a mast file can set a local one (a LAN server keeps "t" within a few ms)
  ntp_server: pool.ntp.org
  # Pins: Waveshare ESP32-S3-ETH pinout (docs.waveshare.com/ESP32-S3-ETH). W5500 is on
  # GPIO 9-14. Not usable for the scanners: GPIO 4-7 (TF card), 0/3/45/46 (strapping),
  # 19/20 (USB), 33-37 (octal PSRAM on the S3R8), 43/44 (UART0 header pins, kept free).
  # All scanner wiring is on header pins 31-40: RX 31-34, TX 35, GND 38, VBUS 40.
  eth_clk: GPIO13
  eth_mosi: GPIO11
  eth_miso: GPIO12
  eth_cs: GPIO14
  eth_int: GPIO10
  eth_rst: GPIO9
  s0_rx: GPIO17   # header pin 34 <- sector 0 XIAO D6 (TX)
  s1_rx: GPIO16   # header pin 32 <- sector 1 XIAO D6
  s2_rx: GPIO18   # header pin 31 <- sector 2 XIAO D6
  cmd_tx: GPIO21  # header pin 35 -> bus TX row -> every XIAO's D7 (RX)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

# All 3 hardware UARTs go to the scanners, so logs use the S3's native USB
logger:
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: ${eth_clk}
  mosi_pin: ${eth_mosi}
  miso_pin: ${eth_miso}
  cs_pin: ${eth_cs}
  interrupt_pin: ${eth_int}
  reset_pin: ${eth_rst}

# Health sensors, chip IDs and buttons reach Home Assistant here
api:
  encryption:
    key: ${api_key}

# Encrypted OTA with the same key; cheaper on flash and RAM than a password
ota:
  - platform: esphome
    encryption:
      key: ${api_key}

# SNTP, not Home Assistant time: HA sets the clock in whole seconds, and "t" in the MQTT
# messages (and the planned frame v3 window sync) needs the sub-second phase
time:
  - platform: sntp
    id: sntp_time
    servers:
      - ${ntp_server}

# Mast-level topics; the sector topics come from sector_scanner below.
#   bletracker/<mast>/online  retained online/offline (birth, will, shutdown)
#   bletracker/<mast>/info    retained, at connect and on "clear"
#   bletracker/<mast>/cmd     gateway commands: "reboot", "clear" (delete and republish the
#                             retained topics). Scanner commands stay on <sector>/cmd, all/cmd.
# Beacon data and commands only: no MQTT devices or entities in Home Assistant.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  birth_message:
    topic: bletracker/${mast}/online
    payload: online
    retain: true
  will_message:
    topic: bletracker/${mast}/online
    payload: offline
    retain: true
  shutdown_message:
    topic: bletracker/${mast}/online
    payload: offline
    retain: true
  on_connect:
    - script.execute: publish_info
  on_message:
    - topic: bletracker/${mast}/cmd
      then:
        - lambda: |-
            if (x == "reboot") {
              ESP_LOGI("bletracker", "Reboot requested over MQTT");
              App.safe_reboot();
            } else if (x == "clear") {
              id(scanners).clear_retained();
              id(publish_info).execute();
            } else {
              ESP_LOGW("bletracker", "Unknown gateway command '%s'", x.c_str());
            }

script:
  - id: publish_info
    then:
      - mqtt.publish:
          topic: bletracker/${mast}/info
          retain: true
          payload: !lambda |-
            char buf[96];
            snprintf(buf, sizeof(buf), "{\"format\":3,\"esphome\":\"%s\",\"build\":%lld}", ESPHOME_VERSION,
                     (long long) App.get_build_time());
            return std::string(buf);

sensor:
  - id: !remove RSSI

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"


# Sector 0's UART also carries the one command TX that every scanner hears; sectors 1
# and 2 are RX-only. Commands are addressed by chip ID, so only the target acts. A bucket can
# reach ~2.3 KB, hence 4096-byte RX buffers.
uart:
  - id: uart_s0
    rx_pin: ${s0_rx}
    tx_pin: ${cmd_tx}
    baud_rate: 115200
    rx_buffer_size: 4096
  - id: uart_s1
    rx_pin: ${s1_rx}
    baud_rate: 115200
    rx_buffer_size: 4096
  - id: uart_s2
    rx_pin: ${s2_rx}
    baud_rate: 115200
    rx_buffer_size: 4096

# The RX pin is the sector (scanners have no sector of their own since firmware 0.5.0).
# expected_chip (16 hex digits) per sector adds a board check: another chip on that pin is a
# SECURITY error, marks its data suspect and turns on "Sector N wrong chip".
# scanner_firmware: the latest scanner firmware (defaults to the one the component was written
# for); a scanner reporting an older one raises FIRMWARE_OUTDATED and "Sector N firmware outdated".
# ignore: the mast's default ignore list, one for all sectors. The gateway drops RSSI and advert
# records from these addresses itself, silently (logger at DEBUG: one line per address every
# 10 s with the drop count). Forms: aa:bb:cc:dd:ee:ff, c1:7d:2b:*:*:* (* = any byte),
# aa:bb:cc:dd:ee:00/40 (prefix bits), aa:bb:cc:dd:ee:ff/ff:ff:ff:00:00:00 (mask). Changes on
# the radios themselves go over MQTT (all/cmd: ignore / unignore / ignore clear).
# payloads / active_scan / budget / intervals: what the gateway keeps applied on every scanner
# (they forget these at boot); MQTT commands change them until the gateway reboots.
sector_scanner:
  id: scanners
  mast: ${mast}
  topic_prefix: bletracker/${mast}
  command_uart_id: uart_s0
  payloads: true
  active_scan: false
  budget: 70
  self_test: true
  scanner_firmware: "0.7.0"
  ignore: []
  gateway_load:
    name: Gateway load
  self_test_result:
    name: Self test
  sectors:
    - id: scanner_s0
      uart_id: uart_s0
      sector: 0
      load:
        name: Sector 0 load
      lost_buckets:
        name: Sector 0 lost buckets
        filters:
          - throttle: 60s
      bad_frames:
        name: Sector 0 bad frames
        filters:
          - throttle: 60s
      devices:
        name: Sector 0 devices
        filters:
          - throttle: 10s
      ignored:
        name: Sector 0 ignored
        unit_of_measurement: adverts/s
        filters:
          - throttle: 10s
      wrong_chip:
        name: Sector 0 wrong chip
      chip:
        name: Sector 0 chip
      firmware:
        name: Sector 0 firmware
      firmware_outdated:
        name: Sector 0 firmware outdated
    - id: scanner_s1
      uart_id: uart_s1
      sector: 1
      load:
        name: Sector 1 load
      lost_buckets:
        name: Sector 1 lost buckets
        filters:
          - throttle: 60s
      bad_frames:
        name: Sector 1 bad frames
        filters:
          - throttle: 60s
      devices:
        name: Sector 1 devices
        filters:
          - throttle: 10s
      ignored:
        name: Sector 1 ignored
        unit_of_measurement: adverts/s
        filters:
          - throttle: 10s
      wrong_chip:
        name: Sector 1 wrong chip
      chip:
        name: Sector 1 chip
      firmware:
        name: Sector 1 firmware
      firmware_outdated:
        name: Sector 1 firmware outdated
    - id: scanner_s2
      uart_id: uart_s2
      sector: 2
      load:
        name: Sector 2 load
      lost_buckets:
        name: Sector 2 lost buckets
        filters:
          - throttle: 60s
      bad_frames:
        name: Sector 2 bad frames
        filters:
          - throttle: 60s
      devices:
        name: Sector 2 devices
        filters:
          - throttle: 10s
      ignored:
        name: Sector 2 ignored
        unit_of_measurement: adverts/s
        filters:
          - throttle: 10s
      wrong_chip:
        name: Sector 2 wrong chip
      chip:
        name: Sector 2 chip
      firmware:
        name: Sector 2 firmware
      firmware_outdated:
        name: Sector 2 firmware outdated

# Addressed to the chip last seen on that sector's RX pin
button:
  - platform: template
    name: Sector 0 flash mode
    entity_category: config
    on_press:
      - lambda: id(scanner_s0).command("flash on");
  - platform: template
    name: Sector 0 reboot scanner
    entity_category: config
    on_press:
      - lambda: id(scanner_s0).command("reboot");
  - platform: template
    name: Sector 1 flash mode
    entity_category: config
    on_press:
      - lambda: id(scanner_s1).command("flash on");
  - platform: template
    name: Sector 1 reboot scanner
    entity_category: config
    on_press:
      - lambda: id(scanner_s1).command("reboot");
  - platform: template
    name: Sector 2 flash mode
    entity_category: config
    on_press:
      - lambda: id(scanner_s2).command("flash on");
  - platform: template
    name: Sector 2 reboot scanner
    entity_category: config
    on_press:
      - lambda: id(scanner_s2).command("reboot");
